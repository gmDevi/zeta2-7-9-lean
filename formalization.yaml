      module: Zeta2Lean.Pair.Main
      status: proved
      note: "Proof file Valuation; with the uniform loss 10⌊log₂ 6n⌋."
    - source: "docs/proof.md §6, Theorem G (growth of the coefficients)"
      lean: Zeta2.Pair.Growth_proof
      module: Zeta2Lean.Pair.Proofs.Growth
      status: proved
      note: >-
        With the rate −0.72 in place of −0.7812. Its hypotheses Stmt_PF and Stmt_CoeffVanish are
        proved in Zeta2Lean/Pair/Proofs; Zeta2Lean.Pair.Main plugs them in.
    - source: "docs/proof.md §7, Theorem A (ℓ-adic separation at ℓ = n − 1)"
