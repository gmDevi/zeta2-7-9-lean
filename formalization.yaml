      module: Zeta2Lean.Pair.Main
      status: proved
      note: "Proof files GenLinearForm, PartialFractions, CoeffVanish and LinearForm."
    - source: "docs/proof.md §4, Theorems D and D∞ (residue level; odd denominators)"
